name: Docker build & push

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================
  # Lint, types and tests: nothing is built until these pass
  # ============================================
  check:
    name: Check (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
      - name: Lint and format
        run: npm run check
      - name: Types (web; the API check already includes them)
        if: matrix.app == 'web'
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npm test

  # ============================================
  # API Dependencies (cached node_modules)
  # ============================================
  api-deps:
    name: API deps (cached node_modules)
    needs: [check]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        id: owner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push deps (production)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.deps
          target: deps-production
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/finkit-api-deps:production-sha-${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/finkit-api-deps:production
          cache-from: type=gha,scope=api-deps-production
          cache-to: type=gha,mode=max,scope=api-deps-production

  # ============================================
  # API Application
  # ============================================
  api:
    name: API app
    runs-on: ubuntu-24.04-arm
    needs: [check, api-deps]
    # api-deps doesn't run on pull requests (nothing is published there); the build installs its own
    if: ${{ !cancelled() && needs.check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.api-deps.result) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        id: owner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/finkit-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      # Pull requests publish nothing, so they build their own production dependencies (api/Dockerfile).
      - name: Dependency image
        id: deps
        run: |
          {
            echo 'args<<EOF'
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "PRODUCTION_DEPS_IMAGE=ghcr.io/${{ steps.owner.outputs.owner_lc }}/finkit-api-deps:production-sha-${{ github.sha }}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.deps.outputs.args }}
          cache-from: type=gha,scope=api-app
          cache-to: type=gha,mode=max,scope=api-app

  # ============================================
  # Web Application
  # ============================================
  web:
    name: Web app
    needs: [check]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        id: owner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/finkit-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-app
          cache-to: type=gha,mode=max,scope=web-app

  # ============================================
  # Deployment Summary
  # ============================================
  summary:
    name: Deployment summary
    needs: [api, web]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Lowercase owner for GHCR
        id: owner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Generate summary
        run: |
          echo "## 🚀 Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### API" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.owner.outputs.owner_lc }}/finkit-api:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.owner.outputs.owner_lc }}/finkit-api:sha-${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Web" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.owner.outputs.owner_lc }}/finkit-web:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.owner.outputs.owner_lc }}/finkit-web:sha-${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deploy" >> $GITHUB_STEP_SUMMARY
          echo "Run \`./deploy.sh\` on your Raspberry Pi to update." >> $GITHUB_STEP_SUMMARY
